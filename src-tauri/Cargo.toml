[package]
name = "uyap-dosya-karsilastirma"
version = "1.2.0"
description = "UYAP Dosya Karşılaştırma - Cumhuriyet Başsavcılığı Analiz Modülü"
authors = ["Sinan Elmas"]
edition = "2021"

[lib]
name = "uyap_dosya_karsilastirma_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# Kurum ağlarındaki otomatik proxy betiğini (PAC) çözmek ve tarayıcı açmak için
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Boyut optimizasyonu için profil ayarları
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
